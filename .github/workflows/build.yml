name: Build BepisPluginSuper

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: microsoft/setup-msbuild@v2
    - uses: NuGet/setup-nuget@v2
    - run: nuget restore BepisPlugins.sln
    - run: msbuild BepisPlugins.sln /p:Configuration=Release /p:Platform="Any CPU"
    - uses: actions/upload-artifact@v4
      with:
        name: BepisPluginSuper-Build
        path: '**/bin/Release/*.dll'
    - if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: '**/bin/Release/*.dll'
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}