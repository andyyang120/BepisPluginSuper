name: Build BepisPluginSuper

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: microsoft/setup-msbuild@v2
    
    - uses: NuGet/setup-nuget@v2
    
    - name: Restore NuGet packages
      run: nuget restore BepisPlugins.sln
    
    - name: Build Solution
      run: msbuild BepisPlugins.sln /p:Configuration=Release /p:Platform="Any CPU" /verbosity:normal
    
    - name: List output files (debug)
      shell: pwsh
      run: |
        Write-Host "=== 查找编译输出的 DLL ==="
        Get-ChildItem -Recurse -Filter "*.dll" | Where-Object { $_.FullName -like "*Release*" } | Select-Object FullName, Length
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BepisPluginSuper-Build
        path: |
          **/bin/Release/**/*.dll
          **/bin/Release/**/*.pdb
        if-no-files-found: warn
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          **/bin/Release/**/*.dll
          **/bin/Release/**/*.pdb
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}